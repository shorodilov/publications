# .github/ISSUE_TEMPLATE/1-content-correction.yml
name: Content correction
description: Report a typo, unclear wording, broken link, or factual correction.
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for small content corrections.

  - type: input
    id: location
    attributes:
      label: Location
      description: Which file, section, heading, or link is affected?
      placeholder: "README.md, metadata.schema.json, docs/..."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text or behavior
      description: What is currently wrong, unclear, outdated, or broken?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Suggested correction
      description: What should it say or do instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, rendered output, or related notes if helpful.
    validations:
      required: false
